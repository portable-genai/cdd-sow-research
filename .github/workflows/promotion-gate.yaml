name: Promotion gate (Hrz4)

# The AUTHORITATIVE promotion verdict (rule R5 / P-08), separate from the pre-merge eval
# smoke check (eval-gate.yaml). Runs `eval/run_eval.py --mode gate` under CDD_PROFILE=platform
# so the shared Hrz4 AI-quality service scores the target and returns the PASS/FAIL gate;
# the job fails closed on the reconciled verdict. Runs on release tags and on demand, and is
# expected to be configured only in deployments that have Hrz4 reachable (QUALITY_GATE_URL +
# the S2S auth token from secrets).

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: promotion-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CDD_PROFILE: platform

jobs:
  gate:
    name: Hrz4 promotion gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the Hrz4 promotion gate
        # --mode gate requires CDD_PROFILE=platform|gcp; fails closed on the Hrz4 verdict.
        #
        # The Hrz4 URL and the S2S credential are exported HERE rather than in the workflow
        # `env:` block, and only when the secret actually has a value. A workflow-level
        # `S2S_TOKEN: ${{ secrets.S2S_TOKEN }}` DEFINES the variable even when the
        # secret is unset, and an unset secret expands to the empty string: the job would then
        # run with a present-but-empty credential. hex-service-kit resolves the S2S
        # credential in three states, so present-but-empty is an operator error that raises
        # `ConfiguredEmptyError`; absent is the zero-secret posture. Conditional export keeps
        # the unconfigured deployment on the absent branch instead of the error branch.
        env:
          QUALITY_GATE_URL_SECRET: ${{ secrets.QUALITY_GATE_URL }}
          S2S_TOKEN_SECRET: ${{ secrets.S2S_TOKEN }}
        run: |
          if [ -n "$QUALITY_GATE_URL_SECRET" ]; then
            export QUALITY_GATE_URL="$QUALITY_GATE_URL_SECRET"
          fi
          if [ -n "$S2S_TOKEN_SECRET" ]; then
            export S2S_TOKEN="$S2S_TOKEN_SECRET"
          fi
          python eval/run_eval.py --mode gate
