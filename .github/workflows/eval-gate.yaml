name: Eval gate

# The pre-merge eval SMOKE check (not the promotion authority). Runs eval/run_eval.py
# --mode smoke over the golden case set and fails (non-zero exit) if any metric —
# sow_groundedness, risk_band_accuracy, citation_accuracy, pii_safety — is below
# threshold. The promotion VERDICT is Hrz4's, run separately by promotion-gate.yaml at
# release time (--mode gate). Workflow name kept stable for branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically offline (run_eval.py drives the real CddService
  # against in-process adapters), so the gate itself needs no cloud credentials. Switch to
  # gcp in a protected environment to score against the live Gen AI evaluation service.
  CDD_PROFILE: local

jobs:
  eval:
    name: eval smoke check (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run eval smoke check
        # Non-zero exit fails the pre-merge check. The authoritative promotion verdict is
        # Hrz4's (promotion-gate.yaml, --mode gate).
        run: python eval/run_eval.py --mode smoke
