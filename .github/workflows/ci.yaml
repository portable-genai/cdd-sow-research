name: CI

# Lint + type-check + tests on the LOCAL profile (a WORKING offline stack), so CI needs
# NO Google Cloud credentials and NO google-cloud-* packages. Integration tests are
# deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CDD_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only — no GCP SDK, locked)
        # Proves the domain + local/onprem profiles install and run with no google-cloud-* deps.
        # Deps come from the committed lockfile so CI builds are reproducible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

  oidc-tests:
    name: pytest (oidc extra — Mode 6 login flow)
    runs-on: ubuntu-latest
    # Runs the PyJWT-dependent tests that lint-type-test's `.[dev]`-only install skips via
    # pytest.importorskip("jwt"): the Mode 6 login flow plus the Mode 4 / Mode 5 token,
    # broker and embed-composition suites. Keep this list in step with every module (and
    # the per-case guards in test_citation_continuation.py) that guards on "jwt", or those
    # tests run nowhere. A SEPARATE job, not a step here, so lint-type-test keeps proving
    # api/app.py and adapters/oidc/* import cleanly with NO PyJWT installed
    # (docs/embedding-and-identity.md Section 4.4's import-safety guarantee).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev + oidc, locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev-oidc.lock
          pip install --no-deps -e .

      - name: Pytest (oidc-dependent tests only)
        run: |
          pytest -m 'not integration' -q \
            tests/unit/test_oidc_auth_flow.py \
            tests/unit/test_oidc_session_identity.py \
            tests/unit/test_access_token_identity.py \
            tests/unit/test_private_key_jwt.py \
            tests/unit/test_embed_token.py \
            tests/unit/test_embed_broker_integration.py \
            tests/unit/test_id_token_subject.py \
            tests/unit/test_embed_app_composition.py \
            tests/unit/test_citation_continuation.py \
            tests/browser/test_identity_harness.py

  managed-adapter-import:
    name: managed adapter dependency smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install managed runtime lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gcp.lock
          pip install --no-deps -e .

      - name: Construct Firestore and KMS clients without network calls
        run: |
          python - <<'PY'
          from google.auth.credentials import AnonymousCredentials
          from google.cloud import firestore, kms_v1

          credentials = AnonymousCredentials()
          firestore.Client(project="dependency-smoke", credentials=credentials)
          kms_v1.KeyManagementServiceClient(credentials=credentials)
          PY

  demo-selftest:
    name: SoW demo walkthrough (headless self-test)
    runs-on: ubuntu-latest
    # Runs the flagship presenter walkthrough unattended against a self-spawned demo
    # server and asserts every step's live state, so a refactor of SowCaseService, the
    # renderer markup, or the control-bar selectors fails the PR instead of surfacing the
    # morning of a stakeholder demo.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev + demo)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,demo]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the walkthrough self-test
        run: HEADLESS=1 DEMO_AUTO=1 PYTHONPATH=src python scripts/sow_demo_playwright.py

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    # Validates the infra/terraform stack offline: no backend, no cloud credentials, so a
    # syntax/reference error (or drifted formatting) fails the PR before anyone applies it.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform fmt (check)
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Terraform validate (platform mode)
        # A wiring smoke that the standalone=false references still type-check. `validate`
        # takes no -var flag (it ignores variable-driven count), so the value is passed via
        # TF_VAR_. This is NOT proof the count=0 path is destroy-safe (only `plan` would
        # show that, which the offline no-creds job cannot run).
        env:
          TF_VAR_standalone: "false"
        run: terraform -chdir=infra/terraform validate

      - name: Terraform production-edge contract tests
        run: terraform -chdir=infra/terraform test -no-color

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    # Fails on known-vulnerable dependencies. Locked requirements files are audited so
    # the result matches exactly what CI and the container image install.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          # --no-deps: the lockfiles are fully compiled (every transitive dep pinned), so
          # audit exactly those versions without re-resolving. Newer pip-audit requires it
          # (or a hashed file) alongside --disable-pip.
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: npm audit (ui, high severity fails)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22.22.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, test, and build the portable console
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      # Header assertions cannot see this failure: the CSP is byte-identical in the working and
      # the broken case. This starts the built server and checks that every script tag in the
      # served document carries the served nonce, on the console AND on an embed document.
      - name: Prove the served documents can hydrate
        working-directory: ui
        run: npm run assert-hydratable

  production-image-build:
    name: immutable API + UI image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22.22.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build tenant-neutral serving images
        run: |
          docker build --pull --tag doc1-api:${GITHUB_SHA} .
          docker build --pull --tag doc1-ui:${GITHUB_SHA} --file ui/Dockerfile ui

      # The loader and its SRI are generated, git-ignored build outputs, so they exist
      # only inside the UI image. Regenerate them in the workspace before hashing, the
      # same way the loader job in release-production-images.yaml does.
      - name: Build the embeddable loader for hashing
        working-directory: ui
        run: |
          npm ci
          npm run build:loader

      - name: Record local image and loader digests
        run: |
          docker inspect --format='api_image_id={{.Id}}' doc1-api:${GITHUB_SHA}
          docker inspect --format='ui_image_id={{.Id}}' doc1-ui:${GITHUB_SHA}
          sha256sum ui/public/embed/v1/cdd-agent.js
          cat ui/public/embed/v1/cdd-agent.js.sri

  portability-browser-evidence:
    name: UI portability evidence (three browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 22.22.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install pinned evidence dependencies
        # --no-deps -e .: the lockfile already pins every dependency, and the evidence run
        # imports tests/browser/identity_harness.py, which imports cdd_sow_research. Without
        # the editable install of this package the harness import fails.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev-oidc.lock
          pip install --no-deps -e .
          pip install playwright==1.61.0
          npm ci --prefix ui

      - name: Install Chromium, Firefox, and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Build and run unattended channel and identity evidence
        env:
          HEADLESS: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm --prefix ui run lint
          npm --prefix ui test
          npm --prefix ui run build
          python scripts/embed_portability_demo.py \
            --browser all \
            --no-pause \
            --scope full \
            --screenshots artifacts/portability/screenshots \
            --evidence artifacts/portability/evidence.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc1-ui-portability-evidence
          path: artifacts/portability
          if-no-files-found: error
