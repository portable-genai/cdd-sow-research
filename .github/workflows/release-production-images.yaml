name: release immutable production images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Artifact Registry prefix, for example asia-southeast1-docker.pkg.dev/project/doc1
        required: true
      version:
        description: Reviewed release identifier
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: ui
            context: ui
            file: ui/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_BUILDER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Resolve registry login host
        id: registry
        env:
          REGISTRY_PREFIX: ${{ inputs.registry }}
        run: |
          host="${REGISTRY_PREFIX%%/*}"
          test -n "${host}"
          test "${host}" != "${REGISTRY_PREFIX}"
          echo "host=${host}" >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ inputs.registry }}/doc1-${{ matrix.name }}:${{ inputs.version }}-quarantine-${{ github.run_id }}

      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ inputs.registry }}/doc1-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Keyless-sign exact digest
        env:
          IMAGE: ${{ inputs.registry }}/doc1-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Promote scanned digest to release tag
        env:
          IMAGE: ${{ inputs.registry }}/doc1-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"

      - name: Record deployment input
        env:
          IMAGE: ${{ inputs.registry }}/doc1-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" | tee "doc1-${{ matrix.name }}.digest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doc1-${{ matrix.name }}-digest
          path: doc1-${{ matrix.name }}.digest
          retention-days: 90

  loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build and record exact loader metadata
        working-directory: ui
        run: |
          npm ci
          npm run build:loader
          sha256sum public/embed/v1/cdd-agent.js > public/embed/v1/cdd-agent.js.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doc1-loader-${{ inputs.version }}
          path: |
            ui/public/embed/v1/cdd-agent.js
            ui/public/embed/v1/cdd-agent.js.sri
            ui/public/embed/v1/cdd-agent.js.sha256
          retention-days: 90
