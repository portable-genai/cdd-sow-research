[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdd-sow-research"
version = "0.0.1"
description = "CDD + Source-of-Wealth Agent — grounded research that turns a KYC pack, corporate registries and adverse media into a cited CDD dossier, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["cdd", "kyc", "aml", "source-of-wealth", "gemini", "adk", "gcp", "bfsi", "financial-crime"]

# Core deps are framework-light so the domain + on-prem/test profile install without
# any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: identity / S2S / fail-closed defaults /
  # WORM audit. agent-eval-kit: the promotion-gate client the platform eval adapter uses.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.6",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to the
  # human-review-console maker-checker console the same way from every producer). Public, pinned by tag, zero-cred.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # The case-document upload route is part of the API surface in EVERY profile, and
  # FastAPI needs the multipart parser to build that route at all: without it the whole
  # app fails to import, not just the upload. So this is a core dependency, not a live one.
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.8.0",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-documentai>=2.31",
  "google-cloud-discoveryengine>=0.13",
  "google-cloud-dlp>=3.20",
  # The gcp guardrail binding is ModelArmorGuardrailAdapter, which imports
  # google.cloud.modelarmor_v1. It was never in this extra, so the gcp profile could not run its
  # own guardrail: the adapter raised ImportError on the first screened request, and the offline
  # gate never noticed because it binds the local heuristic guardrail instead.
  "google-cloud-modelarmor>=0.2",
  "google-cloud-logging>=3.11",
  "google-cloud-firestore>=2.21",
  "google-cloud-kms>=3.5",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "opentelemetry-exporter-otlp>=1.27",  # platform tracer -> agent-observability OTel collector (OTLP)
  "requests>=2.31",  # authenticated OTLP/HTTP session for a private Cloud Run collector
  "a2a-sdk[http-server]>=1.1",
  "mcp>=2.1",
]
# The `live` profile: real uploaded documents read on the operator's own machine, and
# the grounded web research that a laptop cannot do. pypdf recovers a PDF's text layer,
# pypdfium2 + pillow render the pages that have none so the local vision model can
# transcribe them, and google-genai reaches Gemini for adverse media / registry lookups.
live = [
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "google-genai>=1.21",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Validates the rendered Agent Plugins manifest against the vendored specification
  # schemas. A hard dev dependency, not optional: with it optional the manifest test skips,
  # and a permanently skipped test reports the same green as a passing one.
  "jsonschema>=4.26",
  # The document-reading half of the [live] extra. In dev too, so the gate actually
  # exercises PDF parsing and page rendering against real PDF bytes rather than skipping
  # the tests that cover them. These are ordinary Python wheels, not cloud SDKs, so the
  # SDK-free promise of the local/onprem profiles is untouched (google-genai, the cloud
  # half of [live], is deliberately NOT here).
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.16.5",
  # Floored at the version whose CONFIGURATION this repository now uses. `>=1.10` was not a
  # neutral floor: `follow_untyped_imports` and `untyped_calls_exclude` arrived in 1.14, so a
  # resolution below it would not understand the file it is configured by -- the currency
  # decision's case, where a stale floor silently permits the behaviour just removed.
  "mypy>=2.3.1",
  "types-PyYAML",
  "respx>=0.21",
]
# Mode 6's OIDC login/session-cookie flow and the planned, separately validated Mode 4
# access-token adapter (docs/embedding-and-identity.md Sections 4.4 and 6) need PyJWT.
# Optional, NOT in [dev]: adapters/oidc/* import it lazily, inside methods, so the
# SDK-free local/onprem profiles (and the core CI leg) never need it installed.
oidc = [
  "pyjwt[crypto]>=2.9,<3",
]
# The presenter-controlled Playwright walkthrough (scripts/sow_demo_playwright.py). Pinned
# with a minor-version ceiling: Playwright ties its API and bundled-browser revision to the
# package version, so the demo environment stays as reproducible as the gate. After install,
# run `playwright install chromium` once to fetch the browser.
demo = [
  "playwright>=1.49,<2",
]

[project.scripts]
cdd-sow = "cdd_sow_research.cli.main:app"

# Required for the hex-service-kit git+https pin (a direct reference) in [project].dependencies.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cdd_sow_research"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there
# hurts more than it helps. The shipped package (src) and tests stay strict.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

# Two settings that exist so mypy's verdict does not depend on WHICH environment it runs in --
# the property the rest of this section already exists to hold.
#
# `untyped_calls_exclude` drops exactly one complaint -- "this callee has no annotations" --
# for the `google` namespace. `disallow_untyped_calls` exists to stop typed code calling OUR
# untyped code; aimed at a third-party release it is a demand no work here can satisfy, and
# proto-plus generates every message `__init__` without annotations. It silences nothing else:
# a wrong attribute and a wrong argument type on the same call are still reported, which was
# proved by planting both.
untyped_calls_exclude = ["google"]

# `follow_untyped_imports` ANALYSES a dependency that ships no `py.typed` instead of resolving
# it to nothing, so it is MORE checking rather than less. Measured, not assumed: a bogus method
# on a `google.cloud.storage` client was reported by nothing before this and is an
# `attr-defined` error after it, and turning it on immediately surfaced a real type confusion
# in the Model Armor adapter that had been invisible in four trees.
#
# SCOPED to `google.*` on purpose. Set globally it also follows the 3.14 standard library,
# where mypy 2.3.1 cannot parse `annotationlib.py` and reports `Invalid syntax` in a CPython
# source file having checked nothing -- found by running the fleet rather than one sample.
[[tool.mypy.overrides]]
module = ["google.*"]
follow_untyped_imports = true

# Following is the right default and the WRONG answer for generated protobuf modules. Their
# source builds every message class at import time through a descriptor builder, so mypy
# reading it reports `Module has no attribute "Timestamp"` for a class that plainly exists --
# a false finding, and one a blocking gate cannot carry. The `types-protobuf` stubs state the
# truth instead, so mypy is pointed back at them here rather than at the builder.
[[tool.mypy.overrides]]
module = ["google.protobuf.*", "google._upb.*"]
follow_untyped_imports = false
